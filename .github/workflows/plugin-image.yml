# Build, push, sign and attest the semgrep plugin image (feature 0102), for a
# pushed tag plugin-semgrep-v<X.Y.Z> once the owner approves the plugin-release
# environment. This workflow uses no personal registry token. Verification:
# docs/guides/cosign_verification.md ("Plugin image"). Static guards:
# scripts/tests/test_plugin_image_workflow.sh.
name: plugin-image

on:
  push:
    tags:
      - 'plugin-semgrep-v*'

permissions: {}

env:
  IMAGE: ghcr.io/bobinson/vulture-plugin-semgrep

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: plugin-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The tag must name the version plugin.toml and pyproject.toml declare;
      # its output is the only image tag pushed.
      - name: version check
        id: version
        run: |
          version=$(sh scripts/plugin-version-check.sh "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No build cache in or out: both actions cache to the Actions cache
      # backend by default.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: plugins/semgrep
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}

      # The cosign pin and release match release.yml's; the build's own provenance
      # is off, so the attestation below is the only one.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.3'
      - name: sign the pushed digest (keyless) and verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/plugin-image.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: record the digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published \`${IMAGE}:${VERSION}\` at \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
