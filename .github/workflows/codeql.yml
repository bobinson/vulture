name: "CodeQL"

# Advanced setup (replaces GitHub "default setup") so scanning can exclude the
# CWE agent's INTENTIONALLY-vulnerable test corpus via paths-ignore below.
#
# IMPORTANT: after this merges, turn OFF "Default setup" in
#   Settings > Code security > Code scanning
# otherwise CodeQL runs twice (default + this) and double-reports every alert.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Go's extractor does NOT support build-mode: none (only autobuild/
          # manual). The repo has multiple Go modules and no root go.mod, so
          # autobuild can't drive the tree — use manual and build the modules
          # ourselves (see the "Build Go" step below).
          - language: go
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        # TODO: pin to a commit SHA to match this repo's action-pinning convention.
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Deliberately-vulnerable test fixtures must not be scanned — they are
          # intentional bad code (the CWE agent's ReDoS corpus under
          # tests/corpus/fixtures/, and the OWASP-over-CWE pipeline fixture under
          # tests/fixtures/, e.g. agents/owasp/tests/fixtures/vulnerable_flask_app/).
          # Depth-agnostic globs so every agent's fixtures dir is excluded.
          config: |
            paths-ignore:
              - '**/tests/corpus/fixtures/**'
              - '**/tests/fixtures/**'
              - '**/simulated-target/**'

      # Go uses manual build-mode (none is unsupported). The primary module is
      # backend/ (the whole broker + API surface); cli/ and verification/
      # conformance are built best-effort so extraction covers them when they
      # compile, without failing the job. simulated-target is intentionally
      # non-compiling verification code and is excluded above.
      - name: Build Go (manual CodeQL extraction)
        if: matrix.language == 'go'
        shell: bash
        run: |
          set -e
          (cd backend && go build ./...)
          (cd cli && go build ./...) || echo "::warning::cli not extracted (build failed)"
          (cd verification/conformance && go build ./...) || echo "::warning::conformance not extracted (build failed)"

      - name: Perform CodeQL Analysis
        # TODO: pin to a commit SHA to match this repo's action-pinning convention.
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
