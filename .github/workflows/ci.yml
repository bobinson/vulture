name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least-privilege default for every job (CodeQL "actions/missing-workflow-permissions").
# All CI jobs only checkout + build/test/lint locally — none push images, publish
# packages, or comment on PRs — so read-only content access is sufficient. Grant a
# narrower/broader scope per-job if a future job needs it.
permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Go Backend ──────────────────────────────────────────────

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # This repo has NO root go.mod (modules live in backend/ and cli/), so
          # setup-go's default cache lookup fails with "Dependencies file is not
          # found ... Supported file pattern: go.mod" and silently disables
          # module caching. Point it at the real lockfiles; listing both gives
          # every Go job one shared cache key.
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - name: Lint Go
        # golangci-lint v2 (schema v2 config in backend/.golangci.yml). Required
        # because the repo targets Go 1.25 and golangci-lint v1.64.8 was built
        # with Go 1.24 (refuses a newer target). v2 needs action v7+.
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.12.2   # pin for reproducible lint (matches backend/.golangci.yml schema v2)

  # ── Native installer (feature 0055 H8) ──────────────────────

  lint-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh
      - name: install.sh branch tests
        run: sh scripts/tests/test_install_sh.sh
      - name: hash-helper tests
        run: sh scripts/tests/test_hash_sh.sh
      - name: release-artifacts tests
        run: sh scripts/tests/test_release_artifacts.sh
      - name: pbs multiplatform tests
        run: sh scripts/tests/test_pbs_multiplatform.sh
      - name: pbs vendor wiring tests
        run: sh scripts/tests/test_pbs_vendor_wiring.sh
      - name: release preflight tests
        run: sh scripts/tests/test_release_preflight.sh
      - name: smoke-scan contract tests
        run: sh scripts/tests/test_smoke_scan.sh
      - name: ssh-version gate tests (0065 §L2)
        run: sh scripts/tests/test_check_ssh_version.sh

  build-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # This repo has NO root go.mod (modules live in backend/ and cli/), so
          # setup-go's default cache lookup fails with "Dependencies file is not
          # found ... Supported file pattern: go.mod" and silently disables
          # module caching. Point it at the real lockfiles; listing both gives
          # every Go job one shared cache key.
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - name: Build
        run: cd backend && go build -o bin/vulture ./cmd/vulture/

  test-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # This repo has NO root go.mod (modules live in backend/ and cli/), so
          # setup-go's default cache lookup fails with "Dependencies file is not
          # found ... Supported file pattern: go.mod" and silently disables
          # module caching. Point it at the real lockfiles; listing both gives
          # every Go job one shared cache key.
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - name: Test with coverage
        run: cd backend && go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Coverage report (target high; informational, not gated)
        run: |
          cd backend
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Backend coverage: ${COVERAGE} — target is high; monitored, not gated (see CONTRIBUTING.md)"
      - name: Complexity report (target < 10; informational, not gated)
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          echo "Functions over cyclomatic complexity 9 (target < 10; monitored, not gated):"
          (cd backend && gocyclo -over 9 .) || true
          echo "--- top 10 ---"; (cd backend && gocyclo -top 10 .) || true

  # ── Python Agents ───────────────────────────────────────────

  lint-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install ruff
        # Pin ruff: an unpinned `pip install ruff` makes the enforced rule set
        # drift on every ruff release (0.16 broadened defaults, which silently
        # added ~20 rule families). Pinning + the explicit `select` in
        # agents/ruff.toml makes lint fully deterministic. Bump deliberately.
        # KEEP IN SYNC with the ruff pin in agents/shared/pyproject.toml [dev]
        # so `make lint` locally == this job.
        run: pip install ruff==0.16.0
      - name: Lint Python
        run: cd agents && ruff check .

  test-agents:
    runs-on: ubuntu-latest
    needs: lint-agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        # shared[dev] pulls the test stack (pytest, pytest-asyncio, pytest-cov,
        # httpx, anyio) at the versions pinned in shared/pyproject.toml; the
        # other packages share that stack, so plain editable installs suffice.
        run: cd agents && pip install -e "shared/[dev]" && pip install -e chaos_engineering/ && pip install -e owasp/ && pip install -e soc2/ && pip install -e cwe/ && pip install -e prove/ && pip install -e xss/ && pip install -e ssdf/ && pip install -e discover/ && pip install -e asvs/ && pip install -e do178c/
      - name: Test agents
        # Run each package separately: collecting all trees in one pytest
        # invocation collides on duplicate test-file basenames (e.g.
        # test_skills.py) under prepend import mode, since the test dirs have
        # no __init__.py. Per-package runs avoid the collision.
        run: |
          cd agents
          for pkg in shared chaos_engineering owasp soc2 cwe prove xss ssdf discover asvs do178c; do
            echo "::group::pytest $pkg"
            python -m pytest "$pkg/tests/" -v || exit 1
            echo "::endgroup::"
          done
      - name: Complexity report (target < C; informational, not gated)
        run: |
          pip install radon
          echo "Functions at complexity grade C or worse (target < C; monitored, not gated):"
          (cd agents && radon cc . -nc --exclude=".venv/*") || true

  # ── CWE corpus gate (feature 0057 P5e / R17) ────────────────
  # PR lane: the CURATED subset only (`make cwe-corpus`) — deterministic,
  # <~60s, no live LLM. The FULL sweep (Juliet included once vendored) runs on
  # cwe-corpus-nightly.yml so the heavyweight corpus NEVER hits a PR (R17).
  # Standalone job (no other job needs it) so it stays purely additive.
  cwe-corpus:
    runs-on: ubuntu-latest
    needs: lint-agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install agent deps (shared pulls openai-agents → `agents` SDK)
        # The corpus runner imports cwe_agent.skills, which needs
        # `function_tool` from the openai-agents SDK (a vulture-shared dep).
        run: cd agents && pip install -e "shared/[dev]" && pip install -e cwe/
      - name: Curated CWE corpus subset + stale-golden gate
        # `make cwe-corpus` = curated fragments (deterministic, <~60s) +
        # `report_coverage.py --check` (fails CI if VERIFIED_CWES.md drifted).
        run: make cwe-corpus

  # ── Frontend ────────────────────────────────────────────────

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint (ESLint)
        run: cd frontend && npm run lint

  build-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build

  test-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Test
        run: cd frontend && npm test

  # ── Docker Build Verification ───────────────────────────────

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-agents, test-frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # NOTE: deliberately NOT using docker/setup-buildx-action. It creates an
      # isolated docker-container builder that can't see the locally-built
      # vulture-agent-base:latest, so the agent images (FROM it) would try to
      # pull it from a registry and fail. The default 'docker' driver shares
      # the daemon image store, so the base built below is visible to compose.
      - name: Build agent base image
        # The agent images are FROM vulture-agent-base:latest, a locally-built
        # base (agents/Dockerfile.base), not a registry image; it must exist
        # before `docker compose build` or the agent targets fail to resolve it.
        run: docker build -t vulture-agent-base:latest -f agents/Dockerfile.base agents/
      - name: Build all Docker images
        env:
          VULTURE_DB_PASSWORD: ci-test-password
          VULTURE_JWT_SECRET: ci-test-jwt-secret-placeholder
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: docker compose build
      - name: Verify images were created
        run: |
          docker images | grep vulture || true
          echo "Docker build verification passed"
      - name: Verify backend image ships OpenSSH >= 7.6 (0065 §L2)
        # git-over-SSH clones use StrictHostKeyChecking=accept-new, which needs
        # OpenSSH >= 7.6. Assert the shipped backend image satisfies it so a
        # base-image downgrade (or a missing openssh-client) is caught in CI.
        env:
          # compose interpolates the backend service env for ANY command,
          # including `run`; VULTURE_DB_PASSWORD/JWT_SECRET are `:?required`, so
          # without them compose aborts before ssh ever executes. Same dummy
          # values as the build step above.
          VULTURE_DB_PASSWORD: ci-test-password
          VULTURE_JWT_SECRET: ci-test-jwt-secret-placeholder
        run: |
          # `ssh -V` prints to STDERR — the same stream compose uses for its
          # warnings/errors. Piping the merged stream straight into the parser
          # makes a compose failure look like an unparseable version string, so
          # isolate the banner line and surface the raw output on failure.
          out=$(docker compose run --rm --no-deps --entrypoint ssh backend -V 2>&1) || true
          banner=$(printf '%s\n' "$out" | grep -a -m1 'OpenSSH_' || true)
          if [ -z "$banner" ]; then
            echo "::error::could not obtain an ssh banner from the backend image" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          printf '%s\n' "$banner" | sh scripts/check-ssh-version.sh

  # ── Dependency vulnerability gates (per-PR, BLOCKING) ───────
  # dependency-review (below) is the DIFF-SCOPED primary gate: it fails only
  # when a PR *adds* a vulnerable dependency (deterministic, author-actionable).
  # The three full-tree scanners (audit-npm / audit-python / audit-go) catch
  # advisories that appear in ALREADY-present deps (crons rot in a solo repo, so
  # PR time is the reliable trigger) and double as a toolchain-freshness gate
  # (Go stdlib). Escape hatches: frontend/audit-ci.jsonc, .pip-audit-ignore,
  # .github/dependency-review-config.yml (Go has none — bump the dep/toolchain).
  # Mark all FOUR as REQUIRED status checks in branch protection to block merge.

  audit-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: npm dependency audit (audit-ci --high, gating)
        # Same threshold as the release gate; fails the PR on high/critical
        # advisories. --config is REQUIRED: audit-ci does NOT auto-load the
        # allowlist, so the file must be passed explicitly or it is ignored.
        run: cd frontend && npx --yes audit-ci --config audit-ci.jsonc --high

  audit-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: python3 -m pip install pip-audit || python3 -m pip install --break-system-packages pip-audit
      - name: Python dependency audit (pip-audit, gating)
        # Audits the pinned, hashed lockfile. Honors the shared .pip-audit-ignore
        # allowlist (same parser as release.yml / security-digest.yml), but —
        # unlike release — has NO `|| true`, so a finding fails the PR.
        run: |
          IGN=""
          if [ -f .pip-audit-ignore ]; then
            IGN=$(awk '/^[[:space:]]*(CVE|GHSA|PYSEC|OSV)-/ {sub(/^[[:space:]]+/,""); split($0,p,/[: \t]/); if (p[1]!="") printf " --ignore-vuln %s", p[1]}' .pip-audit-ignore)
          fi
          # shellcheck disable=SC2086  # IGN is an intentionally word-split flag list
          pip-audit -r agents/requirements-frozen.txt --strict $IGN

  audit-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # This repo has NO root go.mod (modules live in backend/ and cli/), so
          # setup-go's default cache lookup fails with "Dependencies file is not
          # found ... Supported file pattern: go.mod" and silently disables
          # module caching. Point it at the real lockfiles; listing both gives
          # every Go job one shared cache key.
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Go vulnerability scan (backend)
        # govulncheck reports only vulns reachable from actual call paths (low
        # false-positive). It also flags Go STDLIB CVEs, so a PR built on an
        # unpatched toolchain fails until GO_VERSION picks up the fixed patch.
        run: cd backend && "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Go vulnerability scan (cli)
        run: cd cli && "$(go env GOPATH)/bin/govulncheck" ./...

  dependency-review:
    # Diff-scoped gate: fails a PR that INTRODUCES a vulnerable dependency.
    # PR-only (the action errors on push). Covers npm (package-lock) and Go
    # (go.mod) via GitHub's dependency graph; Python coverage is partial here
    # because the graph does not index the non-standard requirements-frozen.txt
    # — pip-audit (audit-python) remains the authoritative Python gate.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependency review (diff-scoped, gating)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          config-file: ./.github/dependency-review-config.yml
