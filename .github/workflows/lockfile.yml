# .github/workflows/lockfile.yml — 0056 C1 (keystone): CI lockfile-freshness gate.
#
# Catches lockfile drift on EVERY relevant PR (not only at release time): a PR
# that changes an agent dependency — or the generator itself — without re-running
# `make freeze-deps` makes this check go red.
#
# It ALSO runs the release-INSTALLABILITY gate (scripts/check-lockfile-installable.sh):
# a pin can pass freshness (reproducible) yet ship NO wheel for a release target
# under `--only-binary :all:` — e.g. litellm >= 1.92.0 is manylinux-only, so it
# breaks the darwin build. Checking it here surfaces it on the PR instead of at
# release-cut / in the macOS build. Same pinned uv, same fork-PR safety posture.
#
# This is a SEPARATE workflow (not a ci.yml job) ON PURPOSE (audit M4): ci.yml has
# no `on.paths`, so only a standalone workflow can path-scope the gate to just the
# lockfile inputs without running the rest of CI.
#
# Fork-PR safety (LLD §9):
#   - `pull_request` (NEVER `pull_request_target`): runs against untrusted fork
#     code but with NO secrets and NO write scope — the well-known exfil foot-gun
#     of `_target` does not apply.
#   - `permissions: contents: read` only.
#   - the uv pin is read from the TRUSTED BASE-BRANCH CONTENT via the
#     setup-pinned-uv composite (literal `main`, semver-validated) — a fork PR
#     cannot move the pin to choose the uv binary CI executes (audit M3).

name: lockfile-freshness

on:
  pull_request:
    # Scope to main-targeted PRs only: the setup-pinned-uv composite reads the uv
    # pin from the literal `main` ref (M3 anti-exfil), so the gate is only correct
    # where `main` IS the PR's true base.
    #
    # NO workflow-level `paths:` filter (0065): this gate is a REQUIRED status
    # check, and a workflow skipped by a path filter reports NO status, leaving
    # path-filtered-out PRs stuck "waiting for status" forever. So the job ALWAYS
    # runs and reports; the former path scope now lives in the "Detect
    # dependency/lockfile changes" step below, which skips the uv resolve (cheap
    # success) when no dependency/lockfile path changed.
    branches: [main]

permissions:
  contents: read          # least privilege: no write, no secrets -> fork-PR-safe

jobs:
  lockfile-freshness:
    runs-on: ubuntu-latest
    # ENFORCING (0065): a stale lockfile fails the PR — no soak. Regenerate with
    # `make freeze-deps` (scripts/gen-lockfile.sh); the PR cannot merge until
    # agents/requirements-frozen.txt matches the declared agent deps. This keeps
    # the audit-python gate honest: a new/changed Python dependency cannot enter
    # without being relocked, and therefore cannot skip pip-audit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # need the PR base commit to diff which paths changed
      - name: Detect dependency/lockfile changes
        id: scope
        # Git pathspecs mirror the former on.paths scope (M4: a PR editing ONLY
        # the generator inputs is still gated). `agents` recursively covers the
        # agent dep declarations + lockfile-constraints.txt. base.sha is a trusted
        # 40-hex commit id, passed via env (never inlined into the shell).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fail CLOSED: if the diff can't be computed, run the check anyway.
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- \
               agents \
               scripts/gen-lockfile.sh scripts/check-lockfile.sh \
               scripts/check-lockfile-installable.sh scripts/uv-version.sh \
               scripts/lock-date.txt \
               .github/workflows/lockfile.yml .github/actions/setup-pinned-uv) || {
            echo "could not compute base diff (base=$BASE_SHA) — running freshness check to fail safe"
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -n "$changed" ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No dependency/lockfile paths changed — skipping freshness re-check (cheap pass).'
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi
      # Single-source pinned uv, read from the trusted base ref (M3). The local
      # composite is in-repo, so it is not SHA-pinned (it is not a 3rd-party ref).
      - name: Set up pinned uv
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-pinned-uv
      - name: Check lockfile freshness
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/check-lockfile.sh
      # Installability is separate from freshness: freshness proves the lockfile
      # REPRODUCES; this proves every pin has a wheel for every release target
      # under --only-binary (cross-checked from ubuntu via uv --python-platform,
      # against real PyPI). Runs after freshness — a drifted lockfile is fixed by
      # re-locking first anyway.
      - name: Check lockfile installable on all release targets
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/check-lockfile-installable.sh
