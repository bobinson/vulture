services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${VULTURE_POSTGRES_HOST_PORT:-25433}:${VULTURE_POSTGRES_INTERNAL_PORT:-25432}"
    environment:
      - POSTGRES_USER=${VULTURE_DB_USER:-vulture}
      - POSTGRES_PASSWORD=${VULTURE_DB_PASSWORD:?VULTURE_DB_PASSWORD must be set}
      - POSTGRES_DB=${VULTURE_DB_NAME:-vulture}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema migrations are applied by the Go backend at startup
      # (see backend/internal/repository/migrations). The previous
      # `/docker-entrypoint-initdb.d` mount only fired on fresh data
      # volumes and aborted mid-replay on errors — feature 0040
      # replaced it with an in-binary runner that's always authoritative.
      - ./backend/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "port=${VULTURE_POSTGRES_INTERNAL_PORT:-25432}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VULTURE_DB_USER:-vulture} -p ${VULTURE_POSTGRES_INTERNAL_PORT:-25432}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${VULTURE_FRONTEND_HOST:-23001}:${VULTURE_FRONTEND_INTERNAL:-23000}"
    environment:
      - NGINX_ENVSUBST_FILTER=VULTURE_
      - VULTURE_FRONTEND_INTERNAL=${VULTURE_FRONTEND_INTERNAL:-23000}
      - VULTURE_BACKEND_PORT=${VULTURE_BACKEND_PORT:-28080}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${VULTURE_FRONTEND_INTERNAL:-23000}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${VULTURE_BACKEND_PORT:-28080}:${VULTURE_BACKEND_PORT:-28080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VULTURE_PORT=${VULTURE_BACKEND_PORT:-28080}
      - VULTURE_LOCAL_MODE=${VULTURE_LOCAL_MODE:-false}
      - VULTURE_API_KEYS_ENABLED=${VULTURE_API_KEYS_ENABLED:-false}
      - VULTURE_REQUIRE_LLM=${VULTURE_REQUIRE_LLM:-false}
      - VULTURE_USE_LLM=${VULTURE_USE_LLM:-false}
      - VULTURE_WEBHOOK_SECRET=${VULTURE_WEBHOOK_SECRET:-}
      # Security hardening (feature 0065). Every default below preserves the
      # pre-0065 behavior, so Mode A `docker compose up` is unchanged; these are
      # passed through so a Docker/Mode-B operator can actually SET them (they
      # are read by internal/config + pkg/gitutil + internal/service).
      - VULTURE_TRUSTED_PROXIES=${VULTURE_TRUSTED_PROXIES:-}
      - VULTURE_ALLOW_OPEN_REGISTRATION=${VULTURE_ALLOW_OPEN_REGISTRATION:-}
      - VULTURE_SOURCE_ROOT=${VULTURE_SOURCE_ROOT:-}
      - VULTURE_LOGIN_LOCKOUT_MAX=${VULTURE_LOGIN_LOCKOUT_MAX:-}
      - VULTURE_LOGIN_LOCKOUT_WINDOW_SEC=${VULTURE_LOGIN_LOCKOUT_WINDOW_SEC:-}
      - VULTURE_GIT_HOST_ALLOWLIST=${VULTURE_GIT_HOST_ALLOWLIST:-}
      - VULTURE_GIT_ALLOW_REDIRECTS=${VULTURE_GIT_ALLOW_REDIRECTS:-}
      - VULTURE_GIT_SSH_STRICT=${VULTURE_GIT_SSH_STRICT:-}
      - VULTURE_GIT_SSH_KNOWN_HOSTS=${VULTURE_GIT_SSH_KNOWN_HOSTS:-}
      - VULTURE_GIT_SSH_INSECURE=${VULTURE_GIT_SSH_INSECURE:-}
      - VULTURE_WEBHOOK_HOST_ALLOWLIST=${VULTURE_WEBHOOK_HOST_ALLOWLIST:-}
      - VULTURE_ALLOW_INSECURE_LLM=${VULTURE_ALLOW_INSECURE_LLM:-}
      - VULTURE_STRICT_LLM_ENDPOINT=${VULTURE_STRICT_LLM_ENDPOINT:-}
      - VULTURE_DB_DSN=postgres://${VULTURE_DB_USER:-vulture}:${VULTURE_DB_PASSWORD:?VULTURE_DB_PASSWORD must be set}@postgres:${VULTURE_POSTGRES_INTERNAL_PORT:-25432}/${VULTURE_DB_NAME:-vulture}?sslmode=${VULTURE_DB_SSLMODE:-disable}
      - VULTURE_AGENT_CHAOS_URL=http://agent-chaos:${VULTURE_AGENT_CHAOS_PORT:-28001}
      - VULTURE_AGENT_OWASP_URL=http://agent-owasp:${VULTURE_AGENT_OWASP_PORT:-28002}
      - VULTURE_AGENT_SOC2_URL=http://agent-soc2:${VULTURE_AGENT_SOC2_PORT:-28003}
      - VULTURE_AGENT_CWE_URL=http://agent-cwe:${VULTURE_AGENT_CWE_PORT:-28004}
      # The backend's per-agent cutoff. MARGIN RULE: must be >=
      # VULTURE_AGENT_MAX_AUDIT_SECONDS + VULTURE_LLM_CALL_TIMEOUT_SEC
      # (900 + 120 below) -- NOT merely >= the agent ceiling: an agent checks its
      # own deadline only BETWEEN llm calls, so it can overshoot by one whole
      # VULTURE_LLM_CALL_TIMEOUT_SEC. If the backend severs the connection first,
      # the agent never sends its result snapshot and only the partial
      # (skill-phase) result is persisted. Neither timeout was plumbed here
      # before, so compose shipped backend=600s against agent=900s -- short of
      # the rule on both counts; 1200 clears 900 + 120.
      - VULTURE_AGENT_PROXY_TIMEOUT_SEC=${VULTURE_AGENT_PROXY_TIMEOUT_SEC:-1200}
      - VULTURE_AGENT_RESPONSE_HEADER_TIMEOUT_SEC=${VULTURE_AGENT_RESPONSE_HEADER_TIMEOUT_SEC:-600}
      - VULTURE_AGENT_PROVE_URL=http://agent-prove:${VULTURE_AGENT_PROVE_PORT:-28005}
      - VULTURE_AGENT_XSS_URL=http://agent-xss:${VULTURE_AGENT_XSS_PORT:-28006}
      - VULTURE_AGENT_SSDF_URL=http://agent-ssdf:${VULTURE_AGENT_SSDF_PORT:-28007}
      - VULTURE_AGENT_DISCOVER_URL=http://agent-discover:${VULTURE_AGENT_DISCOVER_PORT:-28008}
      - VULTURE_AGENT_DO178C_URL=http://agent-do178c:${VULTURE_AGENT_DO178C_PORT:-28009}
      - VULTURE_AGENT_ASVS_URL=http://agent-asvs:${VULTURE_AGENT_ASVS_PORT:-28010}
      - "VULTURE_JWT_SECRET=${VULTURE_JWT_SECRET:?VULTURE_JWT_SECRET must be set - generate with openssl rand -hex 32}"
      # Shared agent secret. REQUIRED in non-local mode — the backend fails
      # closed at startup without it (security.go); when set it's sent to agents
      # as X-Vulture-Agent-Token. Empty default keeps local-mode dev unaffected.
      - VULTURE_AGENT_TOKEN=${VULTURE_AGENT_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      # §30: the broker egresses to Anthropic/Gemini natively, so the BACKEND
      # (sole key holder) always gets their real keys; agents get none in broker
      # mode (their key lines are VULTURE_AGENT_*-gated below).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VULTURE_EMBEDDING_URL=${VULTURE_EMBEDDING_URL}
      - VULTURE_EMBEDDING_MODEL=${VULTURE_EMBEDDING_MODEL:-text-embedding-3-small}
      - VULTURE_LLM_MODEL=${VULTURE_LLM_MODEL:-}
      - VULTURE_LLM_CTX_SIZE=${VULTURE_LLM_CTX_SIZE:-}
      - VULTURE_AGENT_MAX_AUDIT_SECONDS=${VULTURE_AGENT_MAX_AUDIT_SECONDS:-900}
      - VULTURE_LLM_CALL_TIMEOUT_SEC=${VULTURE_LLM_CALL_TIMEOUT_SEC:-120}
      - VULTURE_AUDIT_EXECUTOR_WORKERS=${VULTURE_AUDIT_EXECUTOR_WORKERS:-8}
      - VULTURE_LLM_MAX_OUTPUT_TOKENS=${VULTURE_LLM_MAX_OUTPUT_TOKENS:-}
      - VULTURE_LOOP_GLOBAL_LIMIT=${VULTURE_LOOP_GLOBAL_LIMIT:-}
      # ── Feature 0064: LLM broker (OFF by default — Mode A unchanged) ──────
      # When on, the backend runs an internal-only broker listener and is the
      # SOLE holder of the provider key; agents get a scoped per-run token
      # instead. The listener binds 0.0.0.0:8090 for in-network agent reach and
      # is intentionally NOT published to the host (internal-only, §11).
      # Postgres-only (the broker's stores live in migration 024).
      - VULTURE_LLM_BROKER=${VULTURE_LLM_BROKER:-off}
      - VULTURE_LLM_BROKER_LISTEN=${VULTURE_LLM_BROKER_LISTEN:-0.0.0.0:8090}
      - VULTURE_LLM_BROKER_PROVIDER=${VULTURE_LLM_BROKER_PROVIDER:-openai}
      - VULTURE_LLM_BROKER_PROVIDER_BASE_URL=${VULTURE_LLM_BROKER_PROVIDER_BASE_URL:-}
      - VULTURE_LLM_BROKER_ALLOW_LOCAL_EGRESS=${VULTURE_LLM_BROKER_ALLOW_LOCAL_EGRESS:-off}
      - VULTURE_LLM_BROKER_MINT_KEY=${VULTURE_LLM_BROKER_MINT_KEY:-}
      - VULTURE_LLM_PROVIDER_ALLOWLIST=${VULTURE_LLM_PROVIDER_ALLOWLIST:-}
      - VULTURE_LLM_FALLBACKS=${VULTURE_LLM_FALLBACKS:-}
      - VULTURE_LLM_BUDGET_USD=${VULTURE_LLM_BUDGET_USD:-}
      # Feature 0076 (Go side, backend only). On a cross-agent dedup collision a
      # deterministic (skill) row outranks an `llm` row at equal-or-lower severity,
      # replacing 0075's score-only "richer row wins". Hard prerequisite of
      # VULTURE_LLM_QUOTE_REANCHOR: re-anchoring CREATES collisions that did not
      # exist before. false restores 0075 winner selection.
      - VULTURE_DEDUP_PREFER_DETERMINISTIC=${VULTURE_DEDUP_PREFER_DETERMINISTIC:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${VULTURE_BACKEND_PORT:-28080}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    volumes:
      - source-cache:/tmp/sources
      - ${VULTURE_SOURCE_DIR:-./}:/mnt/source:ro
    depends_on:
      postgres:
        condition: service_healthy
      agent-chaos:
        condition: service_healthy
      agent-owasp:
        condition: service_healthy
      agent-soc2:
        condition: service_healthy
      agent-cwe:
        condition: service_healthy
      agent-prove:
        condition: service_healthy
      agent-xss:
        condition: service_healthy
      agent-ssdf:
        condition: service_healthy
      agent-discover:
        condition: service_healthy
      agent-do178c:
        condition: service_healthy
      agent-asvs:
        condition: service_healthy
    restart: unless-stopped

  agent-chaos:
    build:
      context: ./agents
      dockerfile: chaos_engineering/Dockerfile
    expose:
      - "${VULTURE_AGENT_CHAOS_PORT:-28001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Feature 0064 key isolation (N1): in broker mode the launcher sets
      # VULTURE_AGENT_*_API_KEY="" so NO provider key is exposed to the agent
      # container; unset (non-broker) falls back to the real key. The `-`
      # (unset-only) default preserves an intentionally-empty value.
      - OPENAI_API_KEY=${VULTURE_AGENT_OPENAI_API_KEY-${OPENAI_API_KEY}}
      # §30: withheld in broker mode too — the agent routes via the broker, and a
      # leaked base URL would make it litellm-wrap the model and skip the token.
      - OPENAI_BASE_URL=${VULTURE_AGENT_OPENAI_BASE_URL-${OPENAI_BASE_URL}}
      - ANTHROPIC_API_KEY=${VULTURE_AGENT_ANTHROPIC_API_KEY-${ANTHROPIC_API_KEY}}
      # Broker OFF by default. When on, the agent reaches the backend's internal
      # broker instead of the provider directly, using its per-run token.
      - VULTURE_LLM_BROKER=${VULTURE_LLM_BROKER:-off}
      - VULTURE_LLM_BROKER_URL=${VULTURE_LLM_BROKER_URL:-http://backend:8090/v1}
      - VULTURE_LLM_MODEL=${VULTURE_LLM_MODEL:-${VULTURE_LLM_MODEL_DEFAULT:-gpt-4o}}
      - VULTURE_USE_LLM=${VULTURE_USE_LLM:-false}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - VULTURE_AGENT_PORT=${VULTURE_AGENT_CHAOS_PORT:-28001}
      - VULTURE_BACKEND_URL=http://backend:${VULTURE_BACKEND_PORT:-28080}
      - VULTURE_LLM_CTX_SIZE=${VULTURE_LLM_CTX_SIZE:-}
      - VULTURE_AGENT_MAX_AUDIT_SECONDS=${VULTURE_AGENT_MAX_AUDIT_SECONDS:-900}
      - VULTURE_LLM_CALL_TIMEOUT_SEC=${VULTURE_LLM_CALL_TIMEOUT_SEC:-120}
      - VULTURE_AUDIT_EXECUTOR_WORKERS=${VULTURE_AUDIT_EXECUTOR_WORKERS:-8}
      - GEMINI_API_KEY=${VULTURE_AGENT_GEMINI_API_KEY-${GEMINI_API_KEY:-}}
      - VULTURE_LLM_MAX_OUTPUT_TOKENS=${VULTURE_LLM_MAX_OUTPUT_TOKENS:-}
      - VULTURE_LOOP_GLOBAL_LIMIT=${VULTURE_LOOP_GLOBAL_LIMIT:-}
      - OPENAI_AGENTS_DISABLE_TRACING=1
      # Feature 0072 validation gate + L5 judge — forwarded so a plain
      # `docker compose up` can enable them without an override file.
      - VULTURE_OBLIGATION_MODE=${VULTURE_OBLIGATION_MODE:-observe}
      - VULTURE_OBLIGATION_STRICT_SCOPE=${VULTURE_OBLIGATION_STRICT_SCOPE:-}
      - VULTURE_L5_OBLIGATIONS=${VULTURE_L5_OBLIGATIONS:-true}
      - VULTURE_CALIBRATION_FILE=${VULTURE_CALIBRATION_FILE:-}
      - VULTURE_USE_VALIDATE_LLM=${VULTURE_USE_VALIDATE_LLM:-false}
      - VULTURE_VALIDATE_LLM_MODEL=${VULTURE_VALIDATE_LLM_MODEL:-}
      - VULTURE_VALIDATE_LLM_TOP_N=${VULTURE_VALIDATE_LLM_TOP_N:-}
      - VULTURE_VALIDATE_LLM_BATCH_SIZE=${VULTURE_VALIDATE_LLM_BATCH_SIZE:-}
      - VULTURE_VALIDATE_LLM_MAX_CONCURRENCY=${VULTURE_VALIDATE_LLM_MAX_CONCURRENCY:-}
      - VULTURE_VALIDATE_LLM_TIMEOUT_MS=${VULTURE_VALIDATE_LLM_TIMEOUT_MS:-}
      - VULTURE_VALIDATE_LLM_PER_BATCH_TIMEOUT_MS=${VULTURE_VALIDATE_LLM_PER_BATCH_TIMEOUT_MS:-}
      - VULTURE_VALIDATE_LLM_TOOLS=${VULTURE_VALIDATE_LLM_TOOLS:-}
      - VULTURE_VALIDATE_LLM_MAX_TOOL_CALLS=${VULTURE_VALIDATE_LLM_MAX_TOOL_CALLS:-}
      - VULTURE_L5_CLOSURE_GATE=${VULTURE_L5_CLOSURE_GATE:-}
      - VULTURE_L5_PROMOTION_CLOSURE=${VULTURE_L5_PROMOTION_CLOSURE:-}
      # Feature 0076 evidence quotation + anchor verification — forwarded so a
      # plain `docker compose up` can tune or roll the feature back without an
      # override file. Every actuator is INERT on these defaults: 0076 only
      # LABELS findings unless QUOTE_VERIFY=enforce AND the matching actuator is
      # turned on. The eight numeric knobs pass through EMPTY on purpose so the
      # agent's own default is the single source of truth (compose must not pin
      # a copy of it). Rollback order: QUOTE_DEMOTE_ABSENT -> QUOTE_REANCHOR ->
      # QUOTE_VERIFY=off -> QUOTE_REQUIRED=false -> TRUST_MODEL_SNIPPET=true ->
      # COERCE_LINES=false -> JSON_SCAN=false.
      - VULTURE_LLM_JSON_SCAN=${VULTURE_LLM_JSON_SCAN:-true}
      - VULTURE_LLM_JSON_SALVAGE=${VULTURE_LLM_JSON_SALVAGE:-true}
      - VULTURE_LLM_COERCE_LINES=${VULTURE_LLM_COERCE_LINES:-true}
      - VULTURE_LLM_TRUST_MODEL_SNIPPET=${VULTURE_LLM_TRUST_MODEL_SNIPPET:-false}
      - VULTURE_LLM_TRUST_MODEL_CHECK_ID=${VULTURE_LLM_TRUST_MODEL_CHECK_ID:-false}
      - VULTURE_LLM_QUOTE_REQUIRED=${VULTURE_LLM_QUOTE_REQUIRED:-true}
      - VULTURE_LLM_QUOTE_VERIFY=${VULTURE_LLM_QUOTE_VERIFY:-observe}
      - VULTURE_LLM_QUOTE_REANCHOR=${VULTURE_LLM_QUOTE_REANCHOR:-false}
      - VULTURE_LLM_QUOTE_DEMOTE_ABSENT=${VULTURE_LLM_QUOTE_DEMOTE_ABSENT:-false}
      - VULTURE_LLM_QUOTE_KEEP_TEXT=${VULTURE_LLM_QUOTE_KEEP_TEXT:-false}
      - VULTURE_LLM_QUOTE_MIN_CHARS=${VULTURE_LLM_QUOTE_MIN_CHARS:-}
      - VULTURE_LLM_QUOTE_MIN_TOKENS=${VULTURE_LLM_QUOTE_MIN_TOKENS:-}
      - VULTURE_LLM_QUOTE_MAX_LINES=${VULTURE_LLM_QUOTE_MAX_LINES:-}
      - VULTURE_LLM_QUOTE_MAX_LINE_CHARS=${VULTURE_LLM_QUOTE_MAX_LINE_CHARS:-}
      - VULTURE_LLM_QUOTE_MAX_CHARS=${VULTURE_LLM_QUOTE_MAX_CHARS:-}
      - VULTURE_LLM_QUOTE_RADIUS=${VULTURE_LLM_QUOTE_RADIUS:-}
      - VULTURE_LLM_QUOTE_MAX_DELTA=${VULTURE_LLM_QUOTE_MAX_DELTA:-}
      - VULTURE_LLM_QUOTE_NEAR_MISS_MIN=${VULTURE_LLM_QUOTE_NEAR_MISS_MIN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${VULTURE_AGENT_CHAOS_PORT:-28001}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    volumes:
      - source-cache:/tmp/sources:ro
      - ${VULTURE_SOURCE_DIR:-./}:/mnt/source:ro
    restart: unless-stopped

  agent-owasp:
    build:
      context: ./agents
      dockerfile: owasp/Dockerfile
    expose:
      - "${VULTURE_AGENT_OWASP_PORT:-28002}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Feature 0064 key isolation (N1): in broker mode the launcher sets
      # VULTURE_AGENT_*_API_KEY="" so NO provider key is exposed to the agent
      # container; unset (non-broker) falls back to the real key. The `-`
      # (unset-only) default preserves an intentionally-empty value.
      - OPENAI_API_KEY=${VULTURE_AGENT_OPENAI_API_KEY-${OPENAI_API_KEY}}
      # §30: withheld in broker mode too — the agent routes via the broker, and a
      # leaked base URL would make it litellm-wrap the model and skip the token.
      - OPENAI_BASE_URL=${VULTURE_AGENT_OPENAI_BASE_URL-${OPENAI_BASE_URL}}
      - ANTHROPIC_API_KEY=${VULTURE_AGENT_ANTHROPIC_API_KEY-${ANTHROPIC_API_KEY}}
      # Broker OFF by default. When on, the agent reaches the backend's internal
      # broker instead of the provider directly, using its per-run token.
      - VULTURE_LLM_BROKER=${VULTURE_LLM_BROKER:-off}
      - VULTURE_LLM_BROKER_URL=${VULTURE_LLM_BROKER_URL:-http://backend:8090/v1}
      - VULTURE_LLM_MODEL=${VULTURE_LLM_MODEL:-${VULTURE_LLM_MODEL_DEFAULT:-gpt-4o}}
      - VULTURE_USE_LLM=${VULTURE_USE_LLM:-false}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - VULTURE_AGENT_PORT=${VULTURE_AGENT_OWASP_PORT:-28002}
      - VULTURE_BACKEND_URL=http://backend:${VULTURE_BACKEND_PORT:-28080}
      - VULTURE_LLM_CTX_SIZE=${VULTURE_LLM_CTX_SIZE:-}
      - VULTURE_AGENT_MAX_AUDIT_SECONDS=${VULTURE_AGENT_MAX_AUDIT_SECONDS:-900}
      - VULTURE_LLM_CALL_TIMEOUT_SEC=${VULTURE_LLM_CALL_TIMEOUT_SEC:-120}
      - VULTURE_AUDIT_EXECUTOR_WORKERS=${VULTURE_AUDIT_EXECUTOR_WORKERS:-8}
      - GEMINI_API_KEY=${VULTURE_AGENT_GEMINI_API_KEY-${GEMINI_API_KEY:-}}
      - VULTURE_LLM_MAX_OUTPUT_TOKENS=${VULTURE_LLM_MAX_OUTPUT_TOKENS:-}
      - VULTURE_LOOP_GLOBAL_LIMIT=${VULTURE_LOOP_GLOBAL_LIMIT:-}
      - OPENAI_AGENTS_DISABLE_TRACING=1
      # Feature 0072 validation gate + L5 judge — forwarded so a plain
      # `docker compose up` can enable them without an override file.
      - VULTURE_OBLIGATION_MODE=${VULTURE_OBLIGATION_MODE:-observe}
      - VULTURE_OBLIGATION_STRICT_SCOPE=${VULTURE_OBLIGATION_STRICT_SCOPE:-}
      - VULTURE_L5_OBLIGATIONS=${VULTURE_L5_OBLIGATIONS:-true}
      - VULTURE_CALIBRATION_FILE=${VULTURE_CALIBRATION_FILE:-}
      - VULTURE_USE_VALIDATE_LLM=${VULTURE_USE_VALIDATE_LLM:-false}
      - VULTURE_VALIDATE_LLM_MODEL=${VULTURE_VALIDATE_LLM_MODEL:-}
      - VULTURE_VALIDATE_LLM_TOP_N=${VULTURE_VALIDATE_LLM_TOP_N:-}
      - VULTURE_VALIDATE_LLM_BATCH_SIZE=${VULTURE_VALIDATE_LLM_BATCH_SIZE:-}
      - VULTURE_VALIDATE_LLM_MAX_CONCURRENCY=${VULTURE_VALIDATE_LLM_MAX_CONCURRENCY:-}
      - VULTURE_VALIDATE_LLM_TIMEOUT_MS=${VULTURE_VALIDATE_LLM_TIMEOUT_MS:-}
      - VULTURE_VALIDATE_LLM_PER_BATCH_TIMEOUT_MS=${VULTURE_VALIDATE_LLM_PER_BATCH_TIMEOUT_MS:-}
      - VULTURE_VALIDATE_LLM_TOOLS=${VULTURE_VALIDATE_LLM_TOOLS:-}
      - VULTURE_VALIDATE_LLM_MAX_TOOL_CALLS=${VULTURE_VALIDATE_LLM_MAX_TOOL_CALLS:-}
      - VULTURE_L5_CLOSURE_GATE=${VULTURE_L5_CLOSURE_GATE:-}
      - VULTURE_L5_PROMOTION_CLOSURE=${VULTURE_L5_PROMOTION_CLOSURE:-}
      # Feature 0076 evidence quotation + anchor verification — forwarded so a
      # plain `docker compose up` can tune or roll the feature back without an
      # override file. Every actuator is INERT on these defaults: 0076 only
      # LABELS findings unless QUOTE_VERIFY=enforce AND the matching actuator is
      # turned on. The eight numeric knobs pass through EMPTY on purpose so the
      # agent's own default is the single source of truth (compose must not pin
      # a copy of it). Rollback order: QUOTE_DEMOTE_ABSENT -> QUOTE_REANCHOR ->
      # QUOTE_VERIFY=off -> QUOTE_REQUIRED=false -> TRUST_MODEL_SNIPPET=true ->
      # COERCE_LINES=false -> JSON_SCAN=false.
      - VULTURE_LLM_JSON_SCAN=${VULTURE_LLM_JSON_SCAN:-true}
      - VULTURE_LLM_JSON_SALVAGE=${VULTURE_LLM_JSON_SALVAGE:-true}
      - VULTURE_LLM_COERCE_LINES=${VULTURE_LLM_COERCE_LINES:-true}
      - VULTURE_LLM_TRUST_MODEL_SNIPPET=${VULTURE_LLM_TRUST_MODEL_SNIPPET:-false}
      - VULTURE_LLM_TRUST_MODEL_CHECK_ID=${VULTURE_LLM_TRUST_MODEL_CHECK_ID:-false}
      - VULTURE_LLM_QUOTE_REQUIRED=${VULTURE_LLM_QUOTE_REQUIRED:-true}
      - VULTURE_LLM_QUOTE_VERIFY=${VULTURE_LLM_QUOTE_VERIFY:-observe}
      - VULTURE_LLM_QUOTE_REANCHOR=${VULTURE_LLM_QUOTE_REANCHOR:-false}
      - VULTURE_LLM_QUOTE_DEMOTE_ABSENT=${VULTURE_LLM_QUOTE_DEMOTE_ABSENT:-false}
      - VULTURE_LLM_QUOTE_KEEP_TEXT=${VULTURE_LLM_QUOTE_KEEP_TEXT:-false}
      - VULTURE_LLM_QUOTE_MIN_CHARS=${VULTURE_LLM_QUOTE_MIN_CHARS:-}
