# golangci-lint configuration (schema v2; action + version pinned in
# .github/workflows/ci.yml). Migrated from v1 when the repo moved to Go 1.25 —
# golangci-lint v1.64.8 was built with Go 1.24 and cannot target 1.25.
# Default linters apply: errcheck, govet, ineffassign, staticcheck, unused.
version: "2"
run:
  timeout: 5m
linters:
  enable:
    # Feature 0073: bans direct os.Environ() so agent subprocess environments
    # can only be built through localdev.AgentSpawnEnv. Feature 0044 (S5) named
    # this rule in its threat model and never added it — which is why a spawn
    # path that inherited the backend's JWT secret went unnoticed for months.
    - forbidigo
  settings:
    forbidigo:
      # Required: the default (false) matches on source text only, so an
      # aliased `import goos "os"; goos.Environ()` would evade the rule.
      analyze-types: true
      forbid:
        - pattern: '^os\.Environ$'
          msg: >-
            build agent subprocess env via localdev.AgentSpawnEnv / AgentSpawnEnvFromHost
            (feature 0073, 0044 S5). If this call legitimately inherits, add
            //nolint:forbidigo with the reason.
    staticcheck:
      # v2's staticcheck bundles stylecheck (ST*) + quickfix (QF*), which were
      # NOT in v1's default set (v1 ran SA*/gosimple only). Disable both so the
      # migration preserves the prior lint scope (correctness checks, no new
      # style/quickfix nags on existing code).
      checks:
        - all
        - -ST1*
        - -QF1*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
