# OSS-engine compatible: intraprocedural taint only (mode: taint,
# pattern-sources/pattern-sinks) — no Pro-only keys.
rules:
  - id: vulture-python-command-injection-taint
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Attacker-controlled HTTP request data flows into an OS command
      execution sink. Command injection lets an attacker run arbitrary
      shell commands. Use a fixed argv list (never a shell string built
      from user input) and validate/allowlist the user-supplied part.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/78.html
      license: Apache-2.0
      vulture:
        feature: "0058"
        tier: semgrep-taint
    pattern-sources:
      - pattern: flask.request.args.get(...)
      - pattern: flask.request.args[...]
      - pattern: flask.request.form.get(...)
      - pattern: flask.request.form[...]
      - pattern: flask.request.values.get(...)
      - pattern: flask.request.values[...]
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.json
      - pattern: flask.request.data
      - pattern: flask.request.cookies.get(...)
      - pattern: flask.request.headers.get(...)
    pattern-sinks:
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - pattern: subprocess.run(...)
      - pattern: subprocess.call(...)
      - pattern: subprocess.check_call(...)
      - pattern: subprocess.check_output(...)
      - pattern: subprocess.Popen(...)
