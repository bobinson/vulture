# OSS-engine compatible: intraprocedural taint only (mode: taint,
# pattern-sources/pattern-sinks) — no Pro-only keys.
rules:
  - id: vulture-python-path-traversal-taint
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Attacker-controlled HTTP request data flows into a filesystem open
      call. Path traversal ("../") lets an attacker read or write files
      outside the intended directory. Resolve the path and enforce a
      base-directory prefix check (or use a safe-join helper) first.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      references:
        - https://cwe.mitre.org/data/definitions/22.html
      license: Apache-2.0
      vulture:
        feature: "0058"
        tier: semgrep-taint
    pattern-sources:
      - pattern: flask.request.args.get(...)
      - pattern: flask.request.args[...]
      - pattern: flask.request.form.get(...)
      - pattern: flask.request.form[...]
      - pattern: flask.request.values.get(...)
      - pattern: flask.request.values[...]
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.json
      - pattern: flask.request.data
      - pattern: flask.request.cookies.get(...)
      - pattern: flask.request.headers.get(...)
    pattern-sinks:
      - pattern: open(...)
      - pattern: io.open(...)
      - pattern: pathlib.Path(...)
