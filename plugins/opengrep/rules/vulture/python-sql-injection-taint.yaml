# OSS-engine compatible: intraprocedural taint only (mode: taint,
# pattern-sources/pattern-sinks) — no Pro-only keys.
rules:
  - id: vulture-python-sql-injection-taint
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Attacker-controlled HTTP request data flows into a SQL query
      execution sink. SQL injection lets an attacker read or modify the
      database. Use parameterized queries (placeholders + bound
      parameters), never string concatenation or formatting.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/89.html
      license: Apache-2.0
      vulture:
        feature: "0058"
        tier: semgrep-taint
    pattern-sources:
      - pattern: flask.request.args.get(...)
      - pattern: flask.request.args[...]
      - pattern: flask.request.form.get(...)
      - pattern: flask.request.form[...]
      - pattern: flask.request.values.get(...)
      - pattern: flask.request.values[...]
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.json
      - pattern: flask.request.data
      - pattern: flask.request.cookies.get(...)
      - pattern: flask.request.headers.get(...)
    pattern-sinks:
      - pattern: $CURSOR.execute(...)
      - pattern: $CURSOR.executemany(...)
      - pattern: $CURSOR.executescript(...)
