# Reference manifest for a community-signed container plugin (illustrative:
# "ExampleScan" by "example-org" is fictional). It is the concrete contract
# example for spec validation + plugin authors.

[plugin]
name           = "examplescan"
display_name   = "ExampleScan"
version        = "1.0.0"
api_version    = "vulture-plugin/1.0"
publisher      = "example-org"
description    = "Cross-language SAST via the ExampleScan engine and its bundled rules."
homepage       = "https://example.org/examplescan"
license        = "Apache-2.0"
documentation  = "https://github.com/example-org/vulture-plugin-examplescan"

[trust]
tier           = "community-signed"
signature      = "cosign://sigstore/example-org/vulture-plugin-examplescan"
required_ack   = []

[runtime]
type           = "container"
image          = "ghcr.io/example-org/vulture-plugin-examplescan:1.0.0"
port           = 8080
health_endpoint = "/health"
info_endpoint  = "/info"
run_endpoint   = "/run"
restart        = "unless-stopped"
network        = "internal"
resources      = { cpu = "2", memory = "4Gi" }

[runtime.fs]
read           = ["/src"]
write          = ["/tmp/examplescan-cache"]

[runtime.env]
required       = []
optional       = ["EXAMPLESCAN_LICENSE_KEY"]

[[capabilities]]
phase          = "scan"
languages      = ["javascript", "typescript", "python", "go", "java", "ruby", "rust", "csharp", "php"]
emits          = ["finding", "progress", "thinking", "run_started", "run_finished"]
timeout_s      = 900

[normalization]
# The plugin's rules carry CWE metadata; it extracts the map at build time.
# Full mapping ships as mapping_file inside the container.
mapping_file       = "/etc/vulture-plugin/examplescan-rules-to-cwe.json"
# Fallback if a rule isn't in mapping_file or the inline tables below:
fallback_cross_map = "owasp_top_10_2021_to_cwe"

# Inline overrides for rule families the auto-extraction missed:
[normalization.prefix_to_cwe]
"examplescan.javascript.sql-injection"   = "CWE-89"
"examplescan.javascript.xss."            = "CWE-79"
"examplescan.python.os-command."         = "CWE-78"
"examplescan.python.ssrf."               = "CWE-918"
"examplescan.go.weak-hash."              = "CWE-327"
"examplescan.java.sql-injection"         = "CWE-89"
