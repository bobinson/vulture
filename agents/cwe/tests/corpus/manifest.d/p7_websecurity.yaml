# Group: web-security (feature 0070 P7) — 7 live detections in `web_security` (CWE-1022 was reverted; its
# dead detector and fixtures were removed in P8.2).
# Paths are relative to ../fixtures/. `line` is the expected vuln line
# (diagnostic only, positives) per the design schema.
#
# `run_deterministic()` flattens every fixture to ONE file renamed `f.<ext>`, so
# only the SUFFIX survives. Each entry below is therefore content-keyed, and the
# suffix is chosen so the owning arm is actually reachable:
#   * CWE-749  — the WebView arm is `.java`/`.kt` only, the Electron arm `.js`.
#   * CWE-644  — `echo`/`print` count as sinks in `.php` only.
#
# Every clean twin differs MINIMALLY from its positive, and each twin is a shape
# the review measured as a false positive of the naive predicate:
#   * 315 — `password_changed_at` / `ssn_hash` / `cvv_verified`: password
#     WORKFLOW names, which store no password.
#   * 539 — identical cookie with a BOUNDED lifetime: the recommended shape,
#     which a predicate lacking a magnitude test reports as the defect.
#   * 940 — the same handler with an `event.origin` check.
#   * 784/565 — server-side session state instead of the cookie, a benign cookie
#     name, or a signed-value verifier in the ±2-line window.
#   * 644 — `response.getHeader` instead of `request.getHeader` (a response
#     header read is not attacker-controlled), and an encoded/serialised sink.

