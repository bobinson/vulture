# Group: ast_v1 - the corpus of the shared AST layer (feature 0102).
# Paths are relative to ../fixtures/. `line` is the expected sink line
# (diagnostic only, positives) per the design schema.
#
# Three families, the three check ids the AST tier owns: CWE-22 path traversal
# (skill `input_validation`), CWE-918 SSRF and CWE-78 OS command injection
# (skill `injection`). Every fixture is a single file, so it survives the
# runner's flattening (each fixture is copied alone to a temp dir as
# `f.<suffix>` - suffix preserved, filename and layout destroyed). The first
# line of every fixture states the shape it pins; identifiers are synthetic.
#
# Most positives are flows a line-local pattern cannot follow: a request value
# bound, then carried through assignments, helpers, closures, destructuring or
# a callback before it reaches the sink. Most negatives are where a line-local
# pattern over-reports: a sanitiser, a guard, a shadowing local definition, a
# constant, or an operator-controlled (environment) value.
#
# Every clean twin (`<id>_clean` beside `<id>`) differs from its positive by
# the SMALLEST possible edit that removes the flaw: the source, the sink and
# the surrounding code are all still present; only the sanitiser, the guard,
# the argv form or the operator-controlled source appears (cwe_22_1 ->
# cwe_22_1_clean wraps the request value in `path.basename` and changes nothing
# else). A predicate keyed on "source word and sink word in one file" would
# score every twin dirty. A negative with no positive of the same id
# (cwe_22_5_clean, the `nb` rows, cwe_22_48, cwe_22_19_bomb) pins a shape that
# must report nothing on its own.
#
# PRODUCTION, no leading underscore: `load_manifest()` with no fragments globs
# every fragment EXCEPT those whose name starts with `_`. The regex tier cannot
# see most of these positives, so while the AST tier did not own the three
# check ids this group was `_ast_v1.yaml`, out of the production N and the
# global corpus gates and scored only by name. The AST tier owns them, so the
# group counts in N (`report_coverage.py`, `make cwe-corpus-full`, the nightly)
# and tests/_ast_v1.py `load_group` still loads it by name, under either name,
# for tests/e2e/test_0102_ast_corpus.py.
#
# Not a row, deliberately: known false negatives (`known_fn`). The runner
# scores any non-positive as a clean twin, so a known gap listed here would
# read as a passing negative. cwe_78_c_macro.c (a system() behind a #define)
# and cwe_78_c_stdin.c (a stdin line read into a buffer by fgets reaching
# system()) are pinned in tests/unit/test_0102_known_fn.py instead.

