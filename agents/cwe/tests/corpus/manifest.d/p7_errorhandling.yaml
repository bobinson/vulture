# Group: error handling (feature 0070 P7).
# Paths are relative to ../fixtures/. `line` is the expected vuln line
# (diagnostic only, positives) per the design schema.
#
# Each CWE carries 3 positives + 3 clean twins, so `min_fixtures: 3` is met on
# both sides. Every twin differs from its positive by the ONE property the
# predicate keys on — a terminator, a named type, a status check, a thrown
# application exception — so a rule that keys on anything coarser fails the
# gate rather than passing it by accident.
#
# CWE-755 is deliberately ABSENT. After the 396/755 split it keeps only the
# untyped forms, and two of the three (`catch (...)`, C# `catch {`) are
# language-gated: a flattened `f.<ext>` fixture can carry them, but 755's
# existing DECLARED-ONLY status is unchanged by this group, so adding fixtures
# for it would be scope creep rather than attestation.

