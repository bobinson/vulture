# Group: input validation (feature 0070 P7).
# Paths are relative to ../fixtures/. `line` is the expected vuln line
# (diagnostic only, positives) per the design schema.
#
# All five rules are content-keyed and single-file, so they survive the runner's
# flattening (each fixture is copied to a temp dir as one file renamed
# `_neutral.<suffix>` — suffix preserved, filename and layout destroyed).
#
# Every clean twin differs from its positive by the SMALLEST possible edit:
#   * CWE-776 — the literal only (`True`->`False`, `false`->`true`). Each
#     alternative pins the UNSAFE literal, so the hardening twin cannot match;
#     a predicate keyed on the property NAME would score all three twins dirty.
#   * CWE-103 — twin 1 adds the `super.validate(` delegation, twin 2 returns it
#     directly, twin 3 makes the class `abstract` (the carve-out).
#   * CWE-183 — twin swaps the one active-content member (`.svg` -> `.gif`,
#     `image/svg+xml` -> `image/webp`, `.phtml` -> `.webp`). The allow-list name,
#     the collection literal and the upload API are all still present, so a
#     predicate that fires on the NAME alone scores every twin dirty.
#   * CWE-646 — twin replaces the supplied-name decision with a content sniff
#     (`file-type`, `python-magic`, `mime_content_type`). Note the suppressor
#     must be anchored to the IMPORT: the bare substring `file-?type` also
#     matches the ordinary identifier `fileType`, which is present in virtually
#     every upload handler and would disable the rule where it should fire.
#   * CWE-36 — twin replaces the `..`-stripping substitution with the correct
#     canonicalise-then-contain defence (`path.relative` / `os.path.relpath` /
#     `filepath.Rel`). This is the load-bearing pair: 72% of the measured
#     prefix/membership hits ARE this idiom, which is why every membership /
#     startsWith / Contains / HasPrefix arm was deleted rather than guarded.

