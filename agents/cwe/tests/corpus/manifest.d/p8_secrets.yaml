# Group: secrets (feature 0070 P8) — secret_scan/config_files.py.
#
# Paths are relative to ../fixtures/. `line` is the expected vuln line
# (diagnostic only, positives). The runner flattens each fixture to ONE file
# renamed `f.<ext>`, so every rule gated here is content-keyed — the extension
# survives the rename, the filename and the directory do not.
#
# Each pair is a minimal twin: the clean file differs from its positive ONLY in
# whether the value is a LITERAL or a variable indirection. That is the single
# fact the predicate is allowed to key on. A rule that keyed on "there is a
# key called password" instead would score both sides dirty.
#
# NOT gated here, deliberately:
#   * The CWE-526 Dockerfile arm (`ENV` / `ARG`). It is recognised by FILENAME
#     (`Dockerfile` / `Containerfile` / `*.dockerfile`), and a Dockerfile has no
#     extension — the neutral copy is a bare `f`, which the scanner's
#     well-known-filename set does not contain, so the fixture would never be
#     read. Filename-keyed rules are not gateable by construction; the arm is
#     covered by unit tests instead (tests/unit/skills/test_0070_p8_secrets.py).
#   * CWE-798. The generic name-shape arm is pre-existing coverage; this change
#     only PARTITIONS rows off it onto 260/526, so fixtures for it now would
#     attribute shipped coverage to this change.

# ── CWE-526 Cleartext secret in an environment variable ──────────────────
# Three carriers, one per positive: a CI `env:` mapping (1), a compose
# `environment:` LIST item (2) — a shape with no `key:` on the line at all —
# and an `environment:` mapping nested deeper than the top level (3).
# Twin 2 is the load-bearing one: `${DATABASE_PASSWORD}` is the idiom that
# makes a compose file correct, and a predicate that keys on
# `- NAME=` alone scores it dirty.
- {file: p8_secrets/cwe_526_1.yml, language: YAML, cwe: "526", expectation: positive, line: 6}
- {file: p8_secrets/cwe_526_2.yml, language: YAML, cwe: "526", expectation: positive, line: 5}
- {file: p8_secrets/cwe_526_3.yml, language: YAML, cwe: "526", expectation: positive, line: 6}
- {file: p8_secrets/cwe_526_1_clean.yml, language: YAML, cwe: "526", expectation: negative}
- {file: p8_secrets/cwe_526_2_clean.yml, language: YAML, cwe: "526", expectation: negative}
- {file: p8_secrets/cwe_526_3_clean.yml, language: YAML, cwe: "526", expectation: negative}

# ── CWE-260 Password in a configuration file ─────────────────────────────
# One positive per config dialect the module parses: JSON (1), YAML (2),
# dotenv (3). All three sit OUTSIDE any env block — that is what separates
# them from the 526 rows above, and why the two ids can never both claim a
# line.
- {file: p8_secrets/cwe_260_1.json, language: JSON, cwe: "260", expectation: positive, line: 3}
- {file: p8_secrets/cwe_260_2.yaml, language: YAML, cwe: "260", expectation: positive, line: 5}
- {file: p8_secrets/cwe_260_3.env, language: dotenv, cwe: "260", expectation: positive, line: 2}
- {file: p8_secrets/cwe_260_1_clean.json, language: JSON, cwe: "260", expectation: negative}
- {file: p8_secrets/cwe_260_2_clean.yaml, language: YAML, cwe: "260", expectation: negative}
- {file: p8_secrets/cwe_260_3_clean.env, language: dotenv, cwe: "260", expectation: negative}
