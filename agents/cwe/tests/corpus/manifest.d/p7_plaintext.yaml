# Group: transport security (feature 0070 P7 §1.3) — plaintext_transmission_check.
#
# Paths are relative to ../fixtures/. `line` is the expected vuln line
# (diagnostic only, positives) per the design schema. The runner flattens each
# fixture to ONE file renamed `f.<ext>`, so every rule gated here is
# content-keyed — no filename or directory layout is load-bearing.
#
# Each pair is a minimal twin: the clean file differs from its positive ONLY in
# the value that decides the weakness (verify=True, rejectUnauthorized=true,
# CERT_REQUIRED, a delegating trust body, VERIFYHOST=2, NoFlag, Online,
# https://). That is what forces the predicate to key on the decision rather
# than on the API's presence.
#
# NOT gated here, deliberately:
#   * CWE-319 — the shipped parent keeps its own (DECLARED-ONLY) status; the
#     0070 change only PARTITIONS rows off it onto 523/295, so adding fixtures
#     now would attribute pre-existing coverage to this change.
#   * CWE-347 — this module ships one narrow jwt/jose arm as a regression guard
#     for the CWE-295 relabel; the id's primary owner is elsewhere, and 3
#     positives from one arm would overstate it.
#   * The dropped CLI/system-property revocation arms (`--ssl-no-revoke`,
#     `-Dcom.sun.net.ssl.checkRevocation=false`): they live in shell / gradle /
#     Dockerfile lines this skill does not scan, so they were never built.

