# Group: errors (feature 0070 P8).
# Paths are relative to ../fixtures/. `line` is the expected vuln line
# (diagnostic only, positives) per the design schema.
#
# One rule, three positives, three clean twins.
#
# CWE-460 keys on a STRUCTURE, not on a vocabulary: a handle assigned inside a
# `try` body and released later in that same body, with no release in any
# handler clause. Each twin removes exactly that property and nothing else —
# the release moves into `finally` (1), is duplicated into the handler (2), or
# becomes unnecessary because the handle is bound by a context manager (3).
# A rule keying on the acquire API, the variable name, or "`try` without
# `finally`" fails all three twins instead of passing them.
#
# The three positives use three unrelated resource vocabularies (`close`,
# `release`, `shutdown`) on three unrelated acquire calls, so a rule that
# quietly grew an API allowlist would drop two of them.
