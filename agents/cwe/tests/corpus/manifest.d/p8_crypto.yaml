# ── CWE-760 Use of a One-Way Hash with a Predictable Salt (skill `crypto`) ──
# Every clean twin calls the SAME key-derivation function as its positive; only
# the salt ARGUMENT differs (a CSPRNG draw or a per-user value passed in). That
# is the whole rule — the weakness is the constant salt, not the KDF.
