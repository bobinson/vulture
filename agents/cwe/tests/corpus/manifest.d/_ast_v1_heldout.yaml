# Group: ast_v1_heldout - the held-out set of the shared AST layer (feature 0102,
# LLD §13.6, A37). Paths are relative to ../fixtures/.
#
# Thirty sink sites of the three families the AST tier owns - CWE-22 path
# traversal, CWE-918 SSRF, CWE-78 OS command injection, ten each - sampled
# from three public web applications (JavaScript/TypeScript and Python) at
# recorded commits, after the lexicon freeze, with a recorded seed. Each
# fixture reproduces one site: the target's identifiers renamed, the language
# and the sink/source/guard shape kept, so both tiers decide the fixture as
# they decided the original site. The first line of each fixture states the
# shape; `HELD-OUT-TOKENS:` lists the public API names it keeps that no
# lexicon and no ast_v1 fixture may hold (tests/unit/test_0102_held_out.py).
#
# `expectation` is the HAND ADJUDICATION of the original site, read from its
# code (positive: attacker-controlled data reaches the sink unguarded); the
# reason is the comment above each row. `line` is the site's line on EVERY row,
# positives and negatives alike: the score is per site (the sink call at that
# line), not per file, and is recorded once in the feature's status record.
# A39 (3) accepts `line` on the negative rows: the held-out score is per site.
# Most sites are negatives, by design of the sample: it is stratified over the
# two tiers' agreements and disagreements, not drawn at the population's rate.
#
# LEADING UNDERSCORE, deliberately and permanently: `load_manifest()` with no
# fragments skips every `_`-prefixed fragment, so this group is in no corpus
# gate - not the production N, not `make cwe-corpus` (an explicit fragment
# list), not `make cwe-corpus-full` or the nightly, not the ast_v1 group test
# (which loads its own fragment by name). It keeps the underscore when
# `_ast_v1` becomes `ast_v1`. A held-out result never changes a lexicon or a
# rule; an AST miss or false positive here is a SKILLS.md known-gap candidate.

