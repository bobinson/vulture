# Group: p7 configuration reachability (feature 0070 P7).
# Paths are relative to ../fixtures/. `line` is the expected vuln line
# (diagnostic only, positives) per the design schema.
#
# The runner flattens each fixture to ONE file named `f.<suffix>`, so every rule
# gated here is content-keyed. Extension preconditions that MUST hold or a
# fixture gates as a silent zero:
#   `.config`/`.csproj`/`.xml` -> configuration_check.XML_EXTENSIONS (own walk)
#   `.tsx`/`.cs`               -> configuration_check.DEBUG_CODE_EXTENSIONS
#   `.conf`/`.py`/`.js`/`.ts`/`.yml` -> configuration_check.CONFIG_EXTENSIONS
#
# CWE-1021 carries TWO detectors (the frame-switch arm and the low-severity
# ALLOW-FROM arm) under one id, and the gate is per-CWE at max_fp_rate 0.0 —
# a clean-twin FP from either arm demotes both, so the twins below exercise
# both anchors (`frameguard: {action}`, `SAMEORIGIN`, and a
# `frame-ancestors *.partner.example.com` subdomain allowlist).
#
# CWE-426's real-world target (an extensionless `sudoers` file) is reached in
# production via the skill's extra-filenames entry; the fixtures use `.conf`
# because a fixture named `sudoers` would not survive flattening.


