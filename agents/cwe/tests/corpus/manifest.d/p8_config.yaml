# Group: p8 config reachability (feature 0070 P8).
# Paths are relative to ../fixtures/. `line` is the expected vuln line
# (diagnostic only, positives) per the design schema.
#
# The runner flattens each fixture to ONE file named `_neutral.<ext>`, so every
# rule gated here is content-keyed. Extension preconditions that MUST hold or a
# fixture gates as a silent zero:
#   `.py`/`.js`/`.java`/`.yml` -> configuration_check.CONFIG_EXTENSIONS
#   `.sh`                      -> configuration_check.INSTALL_SCRIPT_EXTENSIONS
#
# A Dockerfile positive is deliberately absent: an extensionless `Dockerfile`
# is reached in production through the scanner's well-known-filename set, but
# flattening renames it, so it would gate as a silent zero. The `--chmod=`
# build arm is covered by unit tests instead.
#
# Every clean twin differs from its positive by ONE token — the mode digit, the
# mask value, or the source of the assigned value — because that token is the
# whole predicate.


