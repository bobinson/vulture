# Group: info exposure (feature 0070 P7) — CWE-359 / 550 / 313 / 215 / 201.
# Paths are relative to ../fixtures/. `line` is the expected vuln line
# (diagnostic only, positives) per the design schema.
#
# The runner flattens each fixture to ONE file renamed `f.<ext>`, so filename
# and directory layout are destroyed. Every rule gated here is content-keyed;
# the only extension-sensitive one is CWE-215's PHP `dd|dump` arm, which is
# unit-tested rather than gated (`var_dump` needs no PHP gate and is used here).
#
# Each clean twin differs from its positive in ONE respect, which is the
# distinction the predicate has to make:
#   359 — the identifier moves from the query string to a POST body / is
#         replaced by a non-personal parameter.
#   550 — the response carries a generic literal instead of the error value.
#   313 — the written CONTENT stops being a credential (path unchanged, so a
#         predicate that keys on the whole line rather than the content
#         position fails the twin).
#   215 — the dumped argument becomes a single lookup / a domain object instead
#         of the whole session or environment.
#   201 — the outbound call carries an explicit header allow-list instead of
#         the inbound collection.

