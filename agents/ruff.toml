# Ruff config for the agents workspace — reproduces the CI ("remote") lint rule
# set so `cd agents && ruff check .` matches CI locally.
#
# Keeps ruff's defaults (E4/E7/E9 + F) and adds the exact curated rules CI
# enforces (the codes surfaced by the lint-agents job). Specific codes (not whole
# families) so noisy checks CI does NOT run — S101/asserts, E501, PLR2004,
# PLR09xx, RUF002/003 — stay off.
target-version = "py312"
line-length = 100

[lint]
extend-select = [
  "I001",     # unsorted-imports (isort)
  "UP035",    # deprecated-import (typing.Iterator -> collections.abc)
  "B017",     # assert-raises-exception
  "BLE001",   # blind-except (except Exception)
  "S110",     # try-except-pass
  "S112",     # try-except-continue
  "EXE001",   # shebang present but file not executable
  "SIM102",   # collapsible-if
  "SIM103",   # needless-bool / return-condition-directly
  "PIE810",   # multiple startswith/endswith -> single tuple call
  "PLC0206",  # dict iteration without .items()
  "PLR0402",  # manual-from-import (import x.y as y)
  "RUF015",   # next() over single-element slice
  "RUF022",   # unsorted __all__
  "RUF100",   # unused noqa
  "FURB167",  # re.I -> re.IGNORECASE
]
# NB: CI also surfaced FURB192 (sorted(...)[0] -> min), which is a preview rule
# in this ruff. It is intentionally NOT enabled here — turning on `preview`
# pulls in many other unrelated preview rules that CI does not run. Add it back
# only if you also pin ruff and confirm CI enables preview.
