[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulture-shared"
version = "0.1.0"
description = "Shared library for Vulture audit agents"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "openai-agents>=0.0.7",
    "litellm>=1.50.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.28.0",
    "tiktoken>=0.7.0",
    "pathspec>=0.12.0",
    # Feature 0102 (shared AST layer): tree-sitter core + nine v1 grammars, all MIT.
    # Ranges per D-A (newest) / D-D (Go, Java, Rust, PHP) / D-H (C, C++ own
    # CWE-22+78 only); the locked versions are fixed by the four-target wheel gate
    # (scripts/check-lockfile-installable.sh) and pinned by test_0102_grammar_versions.
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-javascript>=0.23.1,<0.26",
    "tree-sitter-python>=0.23.6,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-php>=0.25.1,<0.26",
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-cpp>=0.23.4,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff==0.16.0",  # pinned == CI (.github/workflows/ci.yml lint-agents); keep in sync so `make lint` == CI
    "radon>=6.0.0",
    "anyio[trio]>=4.0.0",
    "hypothesis>=6.100",  # feature 0102 property tests (test_0102_property.py)
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.pytest.ini_options]

asyncio_mode = "auto"
testpaths = ["tests"]
# `probe` marks a LIVE-MODEL measurement, not a unit test: it needs an
# OpenAI-compatible endpoint serving a named model and it costs real inference
# time. Feature 0089 item 4.1's tool-call rate is the first one
# (tests/unit/validate/test_0089_4_1_tool_call_rate.py).
#
# `addopts` deselects them by default, which is what keeps them out of CI —
# `.github/workflows/ci.yml` and `make test` both run a bare
# `python -m pytest <pkg>/tests/`, so a marker alone would not have. Selecting
# one is explicit and overrides this, because argparse takes the LAST `-m`:
#
#     python -m pytest tests/unit/validate/test_0089_4_1_tool_call_rate.py \
#         -m probe -rs -v
markers = [
    "probe: live-model measurement; deselected by default, run with `-m probe`",
]
addopts = ["-m", "not probe"]

[tool.ruff]
extend = "../ruff.toml"   # shared agents lint rule set (matches CI)
target-version = "py312"
line-length = 100

[tool.coverage.run]
source = ["shared"]
